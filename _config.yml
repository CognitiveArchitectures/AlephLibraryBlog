title: Aleph Personal Library
description: "A personal library for iPhone and iPad that gives you back what you read: your books, your highlights, your language."
author: Cognitive Architectures S.A.S.
lang: en
# Enlace de Aleph en la App Store. Vacío = el botón principal es la lista de espera; con el enlace, el sitio
# entero (cabecera, portada y pie) pasa a «App Store» en los cinco idiomas.
app_store_url: ""
# Alias (sin @) de un perfil público real para enseñarlo en la portada. Vacío = solo el ejemplo dibujado.
perfil_ejemplo: ""
# Lista de espera: Worker propio (alephlibrary.com/api/lista) con Turnstile. La clave del sitio es pública.
turnstile_sitekey: "0x4AAAAAAF8INclDTH43zm0L"
url: "https://alephlibrary.com"
baseurl: ""  # Debe quedar absolutamente vacío si usas un dominio TLD.
permalink: /:title/
markdown: kramdown
timezone: America/Puerto_Rico
# SEO: genera /sitemap.xml automáticamente (plugin permitido en GitHub Pages)
plugins:
  - jekyll-sitemap
include:
  - .well-known
# Perfil de un lector en la web: alephlibrary.com/@alias (lo sirve 404.html). Lee el perfil
# público de la app con CloudKit Web Services. El token es de API (CloudKit Console › Tokens &
# Keys › API Tokens, entorno Production): está hecho para ir en páginas web y solo lee la base
# pública. Mientras esté vacío, la página muestra el alias y la invitación a Aleph.
cloudkit:
  container: "iCloud.ThinkBigApps.Aleph-Personal-Library"
  environment: "production"
  token: "2e56256f7bfb04a4cdc8e5f7b50c87bb3625240101e33d96cd0b066af8e5a171"
exclude:
  - README.md
  - .gitignore
